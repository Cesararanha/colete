name: Colete validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  app-quality:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test

  pwa-export:
    name: PWA export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Export the web app
        run: npm run build:web
      - name: Verify the PWA boundary
        run: npm run verify:pwa

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Start the local database
        run: npm run db:start
      - name: Recreate the database from migrations
        run: npm run db:reset
      - name: Run pgTAP security tests
        run: npm run db:test
      - name: Stop the disposable local stack
        if: always()
        run: npm run db:stop

  repository-guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Scan the normative baseline
        run: npm run scan:docs
      - name: Verify the Auth session lifetime
        run: npm run verify:auth-config
      - name: Scan for committed secrets
        run: npm run scan:secrets
      - name: Reject high or critical dependency advisories
        run: npm run audit:high

  pwa-smoke:
    name: PWA smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install the pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Export the synthetic smoke build
        run: npm run build:web:smoke
      - name: Run browser smoke tests
        run: npm run test:smoke:web
