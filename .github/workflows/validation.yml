name: Colete validation

# Actions minutes on a private repository are limited, so the triggers are not
# uniform. Every job runs on a pull request, because that is where the change
# is reviewed. Only Repository guardrails also runs on a push to main and on a
# weekly schedule: it is the only job whose result can change while the code
# does not, since it scans for newly published dependency advisories and for
# drift in the normative baseline.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# github.ref is refs/heads/main for a push to main and for a scheduled run
# alike, so without the event name the two new triggers would share one group
# and cancel each other. Keyed by event, a merge and the weekly scan coexist.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  app-quality:
    name: App quality
    # Pull requests only: this job's result cannot change unless the code does.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v24.20.0"
          test "$(npm --version)" = "11.19.0"
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test

  pwa-export:
    name: PWA export
    # Pull requests only: this job's result cannot change unless the code does.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Export the web app
        run: npm run build:web
      - name: Verify the PWA boundary
        run: npm run verify:pwa

  database-security:
    name: Database security
    # Pull requests only: this job's result cannot change unless the code does.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Start the local database
        run: npm run db:start
      - name: Recreate the database from migrations
        run: npm run db:reset
      - name: Run pgTAP security tests
        run: npm run db:test
      - name: Run the transactional idempotency concurrency harness
        run: npm run db:test:idempotency
      - name: Run the identity gateway commit harness
        run: npm run db:test:gateway
      - name: Run the worker lease and lifecycle harness
        run: npm run db:test:worker
      - name: Run the account deletion commit and concurrency harness
        run: npm run db:test:deletion
      - name: Run the data export delivery and reconciliation harness
        run: npm run db:test:export
      - name: Install the pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Export the authentication test build
        run: npm run build:web:auth-e2e
      - name: Run the real authentication browser flow
        run: npm run test:auth:web
      - name: Run the screen 13 privacy controls browser flow
        run: npm run test:privacy:web
      - name: Stop the disposable local stack
        if: always()
        run: npm run db:stop

  repository-guardrails:
    name: Repository guardrails
    # No `if`: this is the job that also runs on push to main and on schedule.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Scan the normative baseline
        run: npm run scan:docs
      - name: Verify the Auth session lifetime
        run: npm run verify:auth-config
      - name: Scan for committed secrets
        run: npm run scan:secrets
      - name: Reject high or critical dependency advisories
        run: npm run audit:high

  pwa-smoke:
    name: PWA smoke
    # Pull requests only: this job's result cannot change unless the code does.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install the pinned Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Export the synthetic smoke build
        run: npm run build:web:smoke
      - name: Run browser smoke tests
        run: npm run test:smoke:web
